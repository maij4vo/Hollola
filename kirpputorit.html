<div class="container mt-4">
  <h1>Kirpputorit</h1>
  <p>Tästä löydät parhaat kirpputorit Hollolassa!</p> 
</div>

<div class="container-fluid mt-4">
  <div id="vastaus"></div>
</div>

<script>
const data = {
  title: "Kirpputorit Hollolassa ja Lahdessa",
  items: [
    { kaupunki: "Hollola", nimi: "Kirpputori Walkkari", kuvaus: "Suosittu paikallinen kirpputori", linkki: "https://kirpputorit24.fi/city/kirpputori-hollola/" },
    { kaupunki: "Hollola", nimi: "Hetki ry kierrätyskeskus", kuvaus: "Kierrätyskeskus ja second hand", linkki: "https://kirpputorit24.fi/city/kirpputori-hollola/" },
    { kaupunki: "Lahti", nimi: "Ahtialan kirpputori", kuvaus: "Iso itsepalvelukirppis Lahdessa", linkki: "https://www.kirppikset.info/paikkakunta/lahti/" },
    { kaupunki: "Lahti", nimi: "Fida Lahti", kuvaus: "Hyvä valikoima vaatteita ja tavaroita", linkki: "https://www.kirppikset.info/paikkakunta/lahti/" },
    { kaupunki: "Lahti", nimi: "UFF Lahti", kuvaus: "Second hand vaatteita", linkki: "https://www.kirppikset.info/paikkakunta/lahti/" }
  ]
};

function naytaKirpputorit(data) {

  let teksti = `<h2 class="text-center mb-4">${data.title}</h2>
                <div class="row">`;

  for (let i = 0; i < data.items.length; i++) {
    let k = data.items[i];

    teksti += `
      <div class="col-md-4 mb-4">
        <div class="card h-100 shadow-sm">
          <div class="card-body text-center">
            <h5 class="card-title">${k.nimi}</h5>
            <h6 class="card-subtitle mb-2 text-muted">${k.kaupunki}</h6>
            <p class="card-text">${k.kuvaus}</p>
            <a href="${k.linkki}" target="_blank" class="btn btn-success">Lisätietoa</a>
          </div>
        </div>
      </div>
    `;
  }

  teksti += `</div>`;

  document.getElementById("vastaus").innerHTML = teksti;
}
naytaKirpputorit(data);
</script>

<p>Myös esim. Hennalasta löytyy Hennalan kirpputori, joka on myös iso ja hyvä!</p>
<p>Kierrätyskeskus Patina, jota ei ole listassa on myös erittäin hyvä, se sijaitsee Hennalan vieressä.</p>
